name: Build HXD Bootstrap
on:
  push:
    paths:
      - 'device-firmware/tcan485-bootstrap/**'
      - '.github/workflows/hxd-bootstrap-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        working-directory: device-firmware/tcan485-bootstrap
        run: pio run
      - name: Create merged binary
        working-directory: device-firmware/tcan485-bootstrap
        run: |
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin -o HXD_TCAN485_Bootstrap_v0.1_merged.bin \
            --flash_mode qio --flash_freq 40m --flash_size 4MB \
            0x1000 .pio/build/tcan485/bootloader.bin \
            0x8000 .pio/build/tcan485/partitions.bin \
            0x10000 .pio/build/tcan485/firmware.bin
          cp .pio/build/tcan485/firmware.bin HXD_TCAN485_Bootstrap_v0.1_ota.bin
      - uses: actions/upload-artifact@v4
        with:
          name: HXD-TCAN485-Bootstrap-v0.1
          path: |
            device-firmware/tcan485-bootstrap/HXD_TCAN485_Bootstrap_v0.1_merged.bin
            device-firmware/tcan485-bootstrap/HXD_TCAN485_Bootstrap_v0.1_ota.bin
