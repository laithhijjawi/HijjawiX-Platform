name: Mobile layout browser QA

on:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/browser-responsive.mjs'
      - '.github/workflows/mobile-visual-check.yml'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser driver
        run: npm install --no-save --no-package-lock playwright
      - name: Find Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test smartphone layout and category navigation
        run: node tests/browser-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hijjawix-browser-screenshots
          path: browser-screenshots/
          if-no-files-found: ignore
          retention-days: 5
