name: Build HXD Android Programmer
on:
  push:
    paths:
      - 'tools/android-esp-programmer/**'
      - '.github/workflows/hxd-android-programmer-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: tools/android-esp-programmer
        run: gradle assembleDebug
      - name: Prepare artifact
        run: |
          cp tools/android-esp-programmer/app/build/outputs/apk/debug/app-debug.apk Hijjawi_ESP_Programmer_v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hijjawi-ESP-Programmer-v0.2
          path: Hijjawi_ESP_Programmer_v0.2-debug.apk
