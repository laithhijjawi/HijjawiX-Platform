name: Build HXD Android Programmer
on:
  push:
    paths:
      - 'tools/android-esp-programmer/**'
      - '.github/workflows/hxd-android-programmer-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: tools/android-esp-programmer
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp tools/android-esp-programmer/app/build/outputs/apk/debug/app-debug.apk Hijjawi_ESP_Programmer_v0.3-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hijjawi-ESP-Programmer-v0.3
          path: Hijjawi_ESP_Programmer_v0.3-debug.apk
