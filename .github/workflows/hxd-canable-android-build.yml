name: Build Hijjawi X CAN Lab APK
on:
  push:
    paths:
      - 'tools/android-canable-tester/**'
      - '.github/workflows/hxd-canable-android-build.yml'
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: tools/android-canable-tester
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK
        run: cp tools/android-canable-tester/app/build/outputs/apk/debug/app-debug.apk HijjawiX_CAN_Lab_v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HijjawiX-CAN-Lab-v0.1
          path: HijjawiX_CAN_Lab_v0.1-debug.apk
          retention-days: 30
