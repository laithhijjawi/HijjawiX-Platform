<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hijjawi X EV Setup</title>
  <link rel="stylesheet" href="/ev-diagnostic/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><strong>HIJJAWI <b>X</b></strong><span>EV OWNER SETUP</span></a>
</header>

<main class="auth-wrap">
  <section class="auth-card">
    <div class="pill">ONE-TIME OWNER BOOTSTRAP</div>
    <h1>إنشاء حساب المالك الأول</h1>
    <p>تستخدم هذه الصفحة مرة واحدة فقط بعد نشر الـAPI.</p>

    <label>Owner Setup Key
      <input id="setupKey" type="password" autocomplete="off">
    </label>
    <label>الاسم
      <input id="displayName" value="Eng. Laith Hijjawi">
    </label>
    <label>البريد الإلكتروني
      <input id="email" type="email" autocomplete="email">
    </label>
    <label>كلمة المرور (10 خانات أو أكثر)
      <input id="password" type="password" autocomplete="new-password">
    </label>

    <button id="createBtn" type="button" class="primary">CREATE OWNER</button>
    <div id="msg" class="msg" style="white-space:pre-wrap;min-height:22px;margin-top:12px"></div>

    <p><a href="/ev-diagnostic/admin.html" style="color:#58a8ff">Owner Dashboard</a></p>
  </section>
</main>

<script>
(() => {
  'use strict';

  const API = 'https://ev-api.hijjawix.com/api/ev';

  const setupKeyEl = document.getElementById('setupKey');
  const displayNameEl = document.getElementById('displayName');
  const emailEl = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const createBtnEl = document.getElementById('createBtn');
  const msgEl = document.getElementById('msg');

  function show(text, ok = false) {
    msgEl.textContent = text;
    msgEl.style.color = ok ? '#55d9a8' : '#ffb75e';
  }

  async function createOwner() {
    const setupKey = setupKeyEl.value.trim();
    const displayName = displayNameEl.value.trim();
    const email = emailEl.value.trim();
    const password = passwordEl.value;

    if (!setupKey) return show('أدخل Owner Setup Key.');
    if (!email) return show('أدخل البريد الإلكتروني.');
    if (password.length < 10) return show('كلمة المرور يجب أن تكون 10 خانات أو أكثر.');

    createBtnEl.disabled = true;
    createBtnEl.textContent = 'CREATING...';
    show('جاري إنشاء حساب OWNER...');

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);

    try {
      const r = await fetch(API + '/setup/owner', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-setup-key': setupKey
        },
        body: JSON.stringify({
          displayName,
          email,
          password,
          locale: 'ar'
        }),
        signal: controller.signal
      });

      const raw = await r.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch (_) {}

      if (!r.ok) {
        throw new Error(data.error || ('HTTP ' + r.status + (raw ? ' · ' + raw : '')));
      }

      show('تم إنشاء حساب OWNER بنجاح. يمكنك الآن فتح Owner Dashboard وتسجيل الدخول.', true);
      createBtnEl.textContent = 'OWNER CREATED';
      createBtnEl.disabled = true;
    } catch (e) {
      const message = e && e.name === 'AbortError'
        ? 'انتهت مهلة الاتصال بالـAPI. تأكد أن ev-api.hijjawix.com يعمل.'
        : (e && e.message ? e.message : 'تعذر إنشاء الحساب.');
      show(message);
      createBtnEl.disabled = false;
      createBtnEl.textContent = 'CREATE OWNER';
    } finally {
      clearTimeout(timer);
    }
  }

  createBtnEl.addEventListener('click', createOwner);
})();
</script>
</body>
</html>
