<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hijjawi X EV Setup</title>
  <link rel="stylesheet" href="/ev-diagnostic/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><strong>HIJJAWI <b>X</b></strong><span>EV OWNER SETUP</span></a>
</header>

<main class="auth-wrap">
  <section class="auth-card">
    <div class="pill">ONE-TIME OWNER BOOTSTRAP</div>
    <h1>إنشاء حساب المالك الأول</h1>
    <p>تستخدم هذه الصفحة مرة واحدة فقط لإنشاء حساب OWNER الأول.</p>

    <div id="resultMsg" class="msg" style="white-space:pre-wrap;min-height:22px;margin-bottom:12px"></div>

    <form method="POST" action="https://ev-api.hijjawix.com/api/ev/setup/owner">
      <input type="hidden" name="locale" value="ar">

      <label>Owner Setup Key
        <input name="setupKey" type="password" autocomplete="off" required>
      </label>

      <label>الاسم
        <input name="displayName" value="Eng. Laith Hijjawi" required>
      </label>

      <label>البريد الإلكتروني
        <input name="email" type="email" autocomplete="email" required>
      </label>

      <label>كلمة المرور (10 خانات أو أكثر)
        <input name="password" type="password" autocomplete="new-password" minlength="10" required>
      </label>

      <button type="submit" class="primary">CREATE OWNER</button>
    </form>

    <p><a href="/ev-diagnostic/admin.html" style="color:#58a8ff">Owner Dashboard</a></p>
  </section>
</main>

<script>
(() => {
  const result = new URLSearchParams(location.search).get('result');
  const box = document.getElementById('resultMsg');
  if (result === 'invalid_key') {
    box.textContent = 'Owner Setup Key غير صحيح.';
    box.style.color = '#ffb75e';
  } else if (result === 'error') {
    box.textContent = 'تعذر إنشاء الحساب. راجع إعدادات الـAPI.';
    box.style.color = '#ffb75e';
  } else {
    box.textContent = 'جاهز لإنشاء حساب OWNER.';
    box.style.color = '#55d9a8';
  }
})();
</script>
</body>
</html>
