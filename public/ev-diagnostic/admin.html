<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hijjawi X EV Owner</title><link rel="stylesheet" href="/ev-diagnostic/styles.css"><style>
.owner-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}th{color:var(--muted);font-size:12px}.badge{padding:5px 9px;border-radius:999px;border:1px solid var(--line);font-size:11px}.pending{color:var(--warn)}.active{color:var(--good)}.suspended{color:var(--bad)}.btn-sm{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:#10233a;color:white;margin:2px}.danger-sm{border-color:#69343b;color:#ff8c95}.owner-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.owner-grid{grid-template-columns:1fr}}</style></head><body>
<header class="topbar"><a class="brand" href="/ev-diagnostic/"><strong>HIJJAWI <b>X</b></strong><span>EV OWNER</span></a><div class="actions"><button id="logout" class="ghost" hidden>خروج</button></div></header>
<main id="loginWrap" class="auth-wrap"><section class="auth-card"><div class="pill">OWNER ONLY</div><h1>دخول الإدارة</h1><label>البريد<input id="email" type="email"></label><label>كلمة المرور<input id="password" type="password"></label><button id="login" class="primary">دخول</button><div id="loginMsg" class="msg"></div></section></main>
<main id="owner" hidden style="padding:30px 5vw 60px"><div class="hero"><div><div class="pill">SECURE DEVICE CONTROL</div><h1>Owner Dashboard</h1><p>إدارة القطع والحسابات والمقترحات من مكان واحد.</p></div><div class="device-card"><span>API</span><strong id="apiState">Checking…</strong><small>ev-api.hijjawix.com</small></div></div>
<div class="owner-grid">
<section class="panel"><div class="owner-actions"><h2 style="flex:1">الأجهزة</h2><button id="refresh" class="ghost">تحديث</button></div><div class="table-wrap"><table><thead><tr><th>Device</th><th>Status</th><th>Firmware</th><th>Last seen</th><th>FPS</th><th>Action</th></tr></thead><tbody id="devices"></tbody></table></div></section>
<section class="panel"><h2>إنشاء حساب</h2><label>الاسم<input id="newName"></label><label>Email<input id="newEmail" type="email"></label><label>Password<input id="newPass" type="password"></label><label>Role<select id="newRole"><option>TECHNICIAN</option><option>GARAGE_ADMIN</option><option>VEHICLE_OWNER</option></select></label><button id="createAccount" class="primary">CREATE ACCOUNT</button><div id="accountMsg" class="msg"></div></section>
<section class="panel" style="grid-column:1/-1"><h2>المقترحات</h2><div id="feedback" class="empty">—</div></section>
</div></main><script src="/ev-diagnostic/admin.js"></script></body></html>
